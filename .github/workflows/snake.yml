name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"      # every day at midnight UTC
  workflow_dispatch:          # lets you run it manually the first time
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#d9c9a3&color_dots=#161210,#4a1a1f,#7d1526,#a8122b,#c8102e
            dist/snake-light.svg?color_snake=#3a2a1f&color_dots=#ece4d4,#e7b1b8,#d6677a,#b81d3a,#8f0f26

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
