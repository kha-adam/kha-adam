<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
  <title id="t">Adam Khalloufi: I build things from first principles</title>
  <desc id="d">Two index fingers approach each other with a glowing red apple in the gap, a nod to the Creation of Adam.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8102e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typeclip">
      <rect x="268" y="286" width="0" height="26">
        <animate attributeName="width" from="0" to="370" dur="2.4s" begin="3.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .mono{font-family:'Courier New',Courier,monospace}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .arm{fill:none;stroke:#d9c9a3;stroke-width:2;stroke-linecap:round;stroke-dasharray:520;stroke-dashoffset:520;animation:draw 2.2s ease-out .4s forwards}
    .arm.r{animation-delay:.8s}
    .tip{fill:#0b0908;stroke:#d9c9a3;stroke-width:2;opacity:0;animation:fade .6s ease 2.6s forwards}
    .fadein{opacity:0;animation:fade 1.2s ease 2.4s forwards}
    .title{opacity:0;animation:fade 1.6s ease 1.8s forwards}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out 3.6s infinite}
    .spark{opacity:0;animation:blink 1.6s steps(1) infinite}
    .glyph{fill:#d9c9a3;opacity:.16;animation:drift 6s ease-in-out infinite alternate}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-12px)}}
  </style>

  <rect width="900" height="340" fill="#0b0908"/>
  <rect x="12" y="12" width="876" height="316" fill="none" stroke="#d9c9a3" stroke-opacity=".35"/>
  <rect x="20" y="20" width="860" height="300" fill="none" stroke="#d9c9a3" stroke-opacity=".15"/>

  <!-- drifting code glyphs -->
  <g class="mono" font-size="16">
    <text class="glyph" x="70"  y="70"  style="animation-delay:0s">{ }</text>
    <text class="glyph" x="170" y="105" style="animation-delay:1s">0x1F</text>
    <text class="glyph" x="300" y="62"  style="animation-delay:2s">-&gt;</text>
    <text class="glyph" x="410" y="96"  style="animation-delay:.5s">&amp;&amp;</text>
    <text class="glyph" x="540" y="64"  style="animation-delay:1.5s">01101</text>
    <text class="glyph" x="660" y="100" style="animation-delay:2.5s">#include</text>
    <text class="glyph" x="790" y="66"  style="animation-delay:.8s">;</text>
    <text class="glyph" x="110" y="238" style="animation-delay:1.2s">*ptr</text>
    <text class="glyph" x="760" y="236" style="animation-delay:2.2s">void</text>
  </g>

  <!-- the two fingers -->
  <path class="arm"   d="M30 210 C130 210 190 170 290 170 L376 170"/>
  <path class="arm r" d="M870 118 C770 118 710 158 610 158 L524 158"/>
  <circle class="tip" cx="376" cy="170" r="4"/>
  <circle class="tip" cx="524" cy="158" r="4"/>

  <!-- the spark in the gap -->
  <g class="mono" font-size="16" fill="#c8102e">
    <text class="spark" x="388" y="174" style="animation-delay:3.6s">· ·</text>
    <text class="spark" x="490" y="162" style="animation-delay:4.0s">· ·</text>
  </g>

  <!-- the apple -->
  <g class="fadein">
    <circle cx="450" cy="164" r="62" fill="url(#glow)"/>
    <g class="pulse">
      <path d="M450 146 C428 136 410 154 417 178 C423 196 438 204 450 198 C462 204 477 196 483 178 C490 154 472 136 450 146 Z" fill="#c8102e"/>
      <path d="M450 146 C450 136 454 130 461 126" fill="none" stroke="#d9c9a3" stroke-width="2" stroke-linecap="round"/>
      <path d="M455 136 C465 124 479 126 483 130 C473 140 461 142 455 136 Z" fill="#d9c9a3" opacity=".85"/>
    </g>
  </g>

  <!-- name and tagline -->
  <text class="serif title" x="450" y="262" text-anchor="middle" font-size="38" letter-spacing="10" fill="#e8dcc0">ADAM KHALLOUFI</text>
  <g clip-path="url(#typeclip)">
    <text class="mono" x="450" y="304" text-anchor="middle" font-size="16" fill="#d9c9a3">I build things from first principles.</text>
  </g>
</svg>
